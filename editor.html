<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STEMMate - Session Plan Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-sm h-[750px] bg-white rounded-3xl shadow-2xl border-4 border-gray-800 flex flex-col overflow-hidden relative">
    
    <!-- Top Offline Banner -->
    <div class="bg-amber-500 text-white text-xs font-semibold px-4 py-2 flex items-center justify-between shadow-md z-20">
      <span>⚠ Offline - Saved Locally</span>
      <span class="text-[10px] bg-amber-700 px-2 py-0.5 rounded">Low-Bandwidth</span>
    </div>

    <!-- Header -->
    <div class="bg-blue-600 text-white px-4 py-3 flex justify-between items-center z-10">
      <h1 class="font-bold text-lg tracking-wide">STEMMate</h1>
      <a href="sync.html" class="text-xs bg-blue-700 hover:bg-blue-800 px-2.5 py-1 rounded-full font-medium">
        Sync Queue (1)
      </a>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto p-4 bg-gray-50">
      <h2 class="font-bold text-gray-800 text-sm mb-1">Session Plan Editor</h2>
      
      <div id="autosave-bar" class="bg-emerald-100 text-emerald-800 text-[11px] px-3 py-1 rounded border border-emerald-300 mb-3 flex items-center justify-between">
        <span>✓ Draft saved locally</span>
        <span class="text-[9px] text-emerald-600">Auto-saved 1m ago</span>
      </div>

      <form oninput="triggerAutoSave()" class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-gray-700 mb-1">Lesson Title</label>
          <input type="text" value="Solar Energy Lab - Grade 9" class="w-full p-2 border rounded-lg bg-white focus:outline-none focus:ring-1 focus:ring-blue-500" />
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-1">Teacher Notes / Variations</label>
          <textarea rows="5" class="w-full p-2 border rounded-lg bg-white focus:outline-none focus:ring-1 focus:ring-blue-500">Divide class into 4 groups. Use outdoor sunlight if available; otherwise use incandescent desk lamps.</textarea>
        </div>
      </form>
    </div>

    <!-- Bottom Navigation -->
    <div class="bg-white border-t border-gray-200 py-2 px-3 flex justify-around text-[10px] text-gray-500 z-10">
      <a href="catalogue.html" class="flex flex-col items-center hover:text-blue-600 font-semibold">
        <span>📖</span> Catalogue
      </a>
      <a href="editor.html" class="flex flex-col items-center text-blue-600 font-semibold">
        <span>📝</span> Plan Editor
      </a>
      <a href="counter.html" class="flex flex-col items-center hover:text-blue-600 font-semibold">
        <span>👥</span> Counter
      </a>
      <a href="sync.html" class="flex flex-col items-center hover:text-blue-600 font-semibold">
        <span>🔄</span> Sync Hub
      </a>
      <a href="login.html" class="flex flex-col items-center text-red-500 font-semibold">
        <span>🚪</span> Logout
      </a>
    </div>

  </div>

  <script>
    function triggerAutoSave() {
      const bar = document.getElementById('autosave-bar');
      bar.innerHTML = '<span>⏳ Saving...</span>';
      setTimeout(() => {
        bar.innerHTML = '<span>✓ Draft saved locally</span><span class="text-[9px] text-emerald-600">Just now</span>';
      }, 500);
    }
  </script>
</body>
</html>
