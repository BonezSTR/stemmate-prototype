<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STEMMate - Attendance Counter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-sm h-[750px] bg-white rounded-3xl shadow-2xl border-4 border-gray-800 flex flex-col overflow-hidden relative">
    
    <!-- Top Offline Banner -->
    <div class="bg-amber-500 text-white text-xs font-semibold px-4 py-2 flex items-center justify-between shadow-md z-20">
      <span>⚠ Offline - Saved Locally</span>
      <span class="text-[10px] bg-amber-700 px-2 py-0.5 rounded">Low-Bandwidth</span>
    </div>

    <!-- Header -->
    <div class="bg-blue-600 text-white px-4 py-3 flex justify-between items-center z-10">
      <h1 class="font-bold text-lg tracking-wide">STEMMate</h1>
      <a href="sync.html" class="text-xs bg-blue-700 hover:bg-blue-800 px-2.5 py-1 rounded-full font-medium">
        Sync Queue (1)
      </a>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto p-4 bg-gray-50 text-center flex flex-col justify-center">
      <h2 class="font-bold text-gray-800 text-sm mb-1">Anonymous Attendance</h2>
      <p class="text-xs text-gray-500 mb-6">Increment counter during session start</p>

      <div class="bg-white p-6 rounded-2xl border shadow-sm max-w-[240px] mx-auto w-full">
        <span class="text-xs text-gray-400 font-bold block uppercase tracking-wider mb-2">Total Students</span>
        <div id="student-count" class="text-5xl font-black text-blue-600 mb-6">24</div>

        <div class="flex justify-center gap-4">
          <button onclick="adjustCounter(-1)" class="w-12 h-12 bg-red-100 text-red-600 rounded-full font-bold text-xl hover:bg-red-200 active:scale-95 transition">-</button>
          <button onclick="adjustCounter(1)" class="w-12 h-12 bg-green-100 text-green-600 rounded-full font-bold text-xl hover:bg-green-200 active:scale-95 transition">+</button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bg-white border-t border-gray-200 py-2 px-3 flex justify-around text-[10px] text-gray-500 z-10">
      <a href="catalogue.html" class="flex flex-col items-center hover:text-blue-600 font-semibold">
        <span>📖</span> Catalogue
      </a>
      <a href="editor.html" class="flex flex-col items-center hover:text-blue-600 font-semibold">
        <span>📝</span> Plan Editor
      </a>
      <a href="counter.html" class="flex flex-col items-center text-blue-600 font-semibold">
        <span>👥</span> Counter
      </a>
      <a href="sync.html" class="flex flex-col items-center hover:text-blue-600 font-semibold">
        <span>🔄</span> Sync Hub
      </a>
      <a href="login.html" class="flex flex-col items-center text-red-500 font-semibold">
        <span>🚪</span> Logout
      </a>
    </div>

  </div>

  <script>
    function adjustCounter(val) {
      const el = document.getElementById('student-count');
      let count = parseInt(el.innerText) + val;
      if (count < 0) count = 0;
      el.innerText = count;
    }
  </script>
</body>
</html>
