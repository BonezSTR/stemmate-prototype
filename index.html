<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STEMMate - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-sm h-[750px] bg-white rounded-3xl shadow-2xl border-4 border-gray-800 flex flex-col overflow-hidden relative">
    
    <!-- Top Offline Banner -->
    <div class="bg-amber-500 text-white text-xs font-semibold px-4 py-2 flex items-center justify-between shadow-md z-20">
      <span>⚠ Offline - Saved Locally</span>
      <span class="text-[10px] bg-amber-700 px-2 py-0.5 rounded">Low-Bandwidth</span>
    </div>

    <!-- Login Main Content -->
    <div class="flex-1 overflow-y-auto p-6 flex flex-col justify-center bg-gray-50">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-3xl font-black mx-auto mb-3 shadow-lg">
          ⚡
        </div>
        <h2 class="font-bold text-gray-800 text-xl">Welcome to STEMMate</h2>
        <p class="text-xs text-gray-500 mt-1">Offline STEM Activity & Session Planner</p>
      </div>

      <!-- Privacy Callout -->
      <div class="bg-blue-50 border border-blue-200 p-3 rounded-lg text-[11px] text-blue-900 mb-6 leading-relaxed">
        🔒 <strong>Privacy Assured:</strong> No personal details or pupil data collected. Enter your School Code or Offline PIN to begin.
      </div>

      <form action="catalogue.html" method="GET" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">School ID / Region Code</label>
          <input type="text" value="SCH-7042" required class="w-full p-2.5 border rounded-lg text-xs bg-white focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Teacher Access PIN</label>
          <input type="password" value="1234" required class="w-full p-2.5 border rounded-lg text-xs bg-white focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg text-xs shadow-md transition text-center block">
          Start Offline Session &rarr;
        </button>
      </form>

      <p class="text-[10px] text-center text-gray-400 mt-6">
        v1.0.4 • Local Cache Ready
      </p>
    </div>

  </div>

</body>
</html>
